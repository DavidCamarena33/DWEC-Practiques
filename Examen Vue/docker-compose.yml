
services:
  mysql:
    image: mysql:latest
    container_name: inventari_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventari_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initdb2:/docker-entrypoint-initdb.d
volumes:
  mysql_data:
